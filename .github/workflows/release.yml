name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Verify version numbers agree
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          # The updater compares WPDKM_VERSION against the release tag, so a
          # header bumped without the constant advertises a permanent false update.
          HEADER_VERSION=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' wpmail-dkim-sign.php | head -1 | tr -d '[:space:]')
          CONSTANT_VERSION=$(sed -n "s/^define( 'WPDKM_VERSION', '\(.*\)' );[[:space:]]*$/\1/p" wpmail-dkim-sign.php | head -1 | tr -d '[:space:]')

          echo "Git tag ................ ${TAG_VERSION}"
          echo "Plugin header .......... ${HEADER_VERSION}"
          echo "WPDKM_VERSION .......... ${CONSTANT_VERSION}"

          VERSION_MISMATCH=0
          for CANDIDATE_VERSION in "${HEADER_VERSION}" "${CONSTANT_VERSION}"; do
            if [ "${CANDIDATE_VERSION}" != "${TAG_VERSION}" ]; then
              VERSION_MISMATCH=1
            fi
          done

          if [ "${VERSION_MISMATCH}" -ne 0 ]; then
            echo "::error::Version mismatch. The plugin header and WPDKM_VERSION must both read ${TAG_VERSION}."
            exit 1
          fi

          echo "All version numbers agree on ${TAG_VERSION}."

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/wpmail-dkim-sign/

      - name: Build release zips
        # Build the versioned zip once, then copy it to the generic
        # filename so both artifacts are guaranteed byte-identical
        # (same SHA256, just different filenames).
        run: |
          cd build
          zip -r wpmail-dkim-sign-${{ steps.get_version.outputs.version }}.zip wpmail-dkim-sign/
          cp wpmail-dkim-sign-${{ steps.get_version.outputs.version }}.zip wpmail-dkim-sign.zip
          cd ..

      - name: Upload versioned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpmail-dkim-sign-${{ steps.get_version.outputs.version }}
          path: build/wpmail-dkim-sign-${{ steps.get_version.outputs.version }}.zip

      - name: Upload generic zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpmail-dkim-sign
          path: build/wpmail-dkim-sign.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/wpmail-dkim-sign-${{ steps.get_version.outputs.version }}.zip
            build/wpmail-dkim-sign.zip
          body: |
            **WP Mail DKIM Sign v${{ steps.get_version.outputs.version }}**

            DKIM-sign outbound WordPress mail at the WP layer, so a valid DKIM-Signature header is attached before the message reaches your upstream SMTP relay.

            Download `wpmail-dkim-sign.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running a previous version will receive this update automatically via the in-plugin GitHub updater.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
